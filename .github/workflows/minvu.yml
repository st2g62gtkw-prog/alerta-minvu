name: Alerta Minvu

on:
  schedule:
    # Cada 2 horas entre 7:00 y 23:00 (hora Chile, UTC-3)
    - cron: "0 10-23/2,0,2 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "normal o prueba"
        default: "prueba"

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Revisar Minvu
        env:
          MODO: ${{ github.event.inputs.modo }}
        run: python check.py
      - name: Guardar lo ya visto
        run: |
          git config user.name "alerta-minvu"
          git config user.email "alerta-minvu@users.noreply.github.com"
          git add seen.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "seen" && git push)
